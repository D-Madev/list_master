<!doctype html>
<html lang="es-AR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>List Master</title>
    <meta
      name="description"
      content="Proyectos, tareas y listas personales. Todo queda guardado en tu iPhone."
    />
    <meta name="theme-color" content="#F7F7F7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="List Master" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="nav-root"></div>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <input id="import-input" type="file" accept="application/json,.json" hidden />

    <noscript>
      <p class="noscript">
        List Master necesita JavaScript para funcionar. Tus datos nunca salen de este
        dispositivo.
      </p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
